name: Publish Tanukifin

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact VERSION already merged into main
        required: true
        type: string
      publish:
        description: I confirm publishing a new signed release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: tanukifin-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.publish
    runs-on: ubuntu-24.04
    outputs:
      artifact: ${{ steps.unsigned.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Reject mismatched versions and existing releases or tags
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py check
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21.0.13+9'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          develocity-injection-enabled: false
          build-scan-publish: false
      - name: Prepare pinned source and check patch
        run: python3 scripts/prepare.py
      - name: Test origin and bridge boundaries
        run: |
          mkdir -p .build/policy-tests
          javac -d .build/policy-tests upstream/app/src/main/java/org/jellyfin/mobile/webapp/ServerOrigin.java checks/ServerOriginTest.java
          java -cp .build/policy-tests org.jellyfin.mobile.webapp.ServerOriginTest
          node checks/bridge.test.cjs upstream
          python3 -m unittest discover -s checks -p 'test_*.py'
      - name: Resolve, audit and build without signing secrets
        run: python3 scripts/build.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: unsigned
        with:
          name: Tanukifin-unsigned-${{ inputs.version }}-${{ github.sha }}
          path: out/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21.0.13+9'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: out/
          merge-multiple: true
      - name: Sign and verify on a fresh runner without executing Gradle
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: python3 scripts/sign.py
      - name: Publish new release without replacing existing assets
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish
